# This is a world configuration file for Paper.
# This file may start empty but can be filled with settings to override ones in the config/paper-world-defaults.yml
#
# For more information, see https://docs.papermc.io/paper/reference/configuration/#per-world-configuration
#
# World: minecraft:filmworld_nether_2

_version: 31
anticheat:
  anti-xray:
    hidden-blocks:
      - ancient_debris
      - bone_block
      - glowstone
      - magma_block
      - nether_bricks
      - nether_gold_ore
      - nether_quartz_ore
      - polished_blackstone_bricks
      - gold_block
    max-block-height: 128
    max-chunk-section-index: 7
    replacement-blocks:
      - basalt
      - blackstone
      - gravel
      - netherrack
      - soul_sand
      - soul_soil
feature-seeds:
  generate-random-seeds-for-all: true

